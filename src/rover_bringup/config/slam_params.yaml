slam_toolbox:
  ros__parameters:
    use_sim_time: false
    slam_mode: true
    mode: mapping

    map_frame: map
    odom_frame: odom
    base_frame: base_link

    scan_topic: /scan
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 1.0
    resolution: 0.05
    max_laser_range: 12.0

    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.05

    tf_buffer_duration: 30.0
    transform_timeout: 0.5
